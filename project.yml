name: PulseType
options:
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 2.2
    CODE_SIGN_STYLE: Automatic
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: 2.3.0
targets:
  PulseType:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Config/AppRuntimePolicy.plist
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niushuanan.PulseType
        PRODUCT_NAME: PulseType
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PulseType 语音输入法
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSUIElement: "NO"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: PulseType 会在你开始普通听写时录音，用于 ASR 转写与 DeepSeek 文本整理。
        INFOPLIST_KEY_NSAppleEventsUsageDescription: PulseType 需要自动化权限，用于把文本写入到其他应用。
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  PulseTypeTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: PulseType
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
